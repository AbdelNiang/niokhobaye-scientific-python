name: CI

on:
  push:
    branches: [main, feature/limited-scientific-methods]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run tests
        run: python -m pytest -q
      - name: Run demo
        run: PYTHONPATH=. python examples/optimization_methods_demo.py
