[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niokhobaye-scientific-python"
version = "0.1.0"
description = "Small scientific Python methods and demos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[tool.setuptools]
py-modules = ["scientific_methods"]
